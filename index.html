
<!DOCTYPE html>

  <title>El arte de equivocarse | Susana Rendón</title>

    }

    html, body {
      margin: 0;

    }

      width: auto !important;
      height: auto !important;
      object-fit: contain;
    }

  <main id="diario"></main>
